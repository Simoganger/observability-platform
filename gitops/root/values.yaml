# =============================================================================
# Component catalog — the single source of truth for WHAT runs and WHICH version.
# Environment files (values-<env>.yaml) only toggle components / override bits.
# Renovate bumps the chart versions below (see renovate.json).
# =============================================================================
global:
  # Overridden by Terraform (helm parameter) at bootstrap time.
  repoURL: https://github.com/CHANGE_ME/observability-lab.git
  targetRevision: main
  # kind | eks | gke | existing  -> selects values-<env>.yaml in each component dir
  env: kind
  destinationServer: https://kubernetes.default.svc
  project: observability
  # Namespace that hosts the whole telemetry stack
  namespace: observability
  # Gateway API implementation behind the shared Gateway: istio | envoy | external
  gatewayProvider: istio

# Default sync policy applied to every Application.
syncPolicy:
  automated:
    prune: true
    selfHeal: true
  retry:
    limit: 10
    backoff:
      duration: 15s
      factor: 2
      maxDuration: 5m

components:
  # ---------------------------------------------------------------- GitOps ---
  argocd:
    enabled: true
    wave: -10
    namespace: argocd
    releaseName: argocd
    chart: { repoURL: https://argoproj.github.io/argo-helm, name: argo-cd, version: 10.20.0 }
    valuesDir: gitops/platform/argocd
    # Argo CD must never prune itself.
    syncPolicy: { automated: { prune: false, selfHeal: true } }

  # ------------------------------------------- Ingress, TLS & identity ---
  # The shared Gateway is plain Gateway API; WHICH implementation programs it is
  # chosen by global.gatewayProvider. Components with `gatewayProvider:` are only
  # rendered for that provider. See docs/sso.md → "Gateway implementation".

  # Gateway API CRDs (standard channel), shared by every implementation.
  gateway-api:
    enabled: true
    wave: -8
    namespace: gateway             # CRDs are cluster-scoped; this creates the Gateway's namespace early
    path: gitops/platform/gateway-api
    pathIsFlat: true
    syncOptions: [ServerSideApply=true]   # CRDs exceed the client-side annotation limit

  # --- provider: istio (default) — istiod is used ONLY as the Gateway controller;
  # no namespace is labelled for sidecar injection.
  istio-base:
    enabled: true
    gatewayProvider: istio
    wave: -7
    namespace: istio-system
    releaseName: istio-base
    chart: { repoURL: https://istio-release.storage.googleapis.com/charts, name: base, version: 1.30.8 }
    valuesDir: gitops/platform/istio-base
    syncOptions: [ServerSideApply=true, RespectIgnoreDifferences=true]
    ignoreDifferences: &istioWebhookDrift   # istiod patches its webhooks at runtime
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        jqPathExpressions: [".webhooks[]?.clientConfig.caBundle", ".webhooks[]?.failurePolicy"]
      - group: admissionregistration.k8s.io
        kind: MutatingWebhookConfiguration
        jqPathExpressions: [".webhooks[]?.clientConfig.caBundle"]
  istiod:
    enabled: true
    gatewayProvider: istio
    wave: -6
    namespace: istio-system
    releaseName: istiod
    chart: { repoURL: https://istio-release.storage.googleapis.com/charts, name: istiod, version: 1.30.8 }
    valuesDir: gitops/platform/istiod
    syncOptions: [ServerSideApply=true, RespectIgnoreDifferences=true]
    ignoreDifferences: *istioWebhookDrift

  # --- provider: envoy — Envoy Gateway. Its own CRDs only; Gateway API CRDs come
  # from the gateway-api component above. OCI charts: Argo CD expects the
  # registry path WITHOUT the oci:// scheme.
  envoy-gateway-crds:
    enabled: true
    gatewayProvider: envoy
    wave: -7
    namespace: envoy-gateway-system
    releaseName: envoy-gateway-crds
    chart: { repoURL: docker.io/envoyproxy, name: gateway-crds-helm, version: 1.10.0 }
    valuesDir: gitops/platform/envoy-gateway-crds
    syncOptions: [ServerSideApply=true]
  envoy-gateway:
    enabled: true
    gatewayProvider: envoy
    wave: -6
    namespace: envoy-gateway-system
    releaseName: envoy-gateway
    chart: { repoURL: docker.io/envoyproxy, name: gateway-helm, version: 1.10.0 }
    valuesDir: gitops/platform/envoy-gateway
    syncOptions: [ServerSideApply=true]

  # --- provider: external — nothing installed; a controller that already exists
  # (GKE Gateway, AWS Load Balancer Controller, Cilium…) programs the Gateway.

  # Certificates for every Gateway listener (Let's Encrypt in the cloud, a lab CA on kind).
  # After gateway-api: its Gateway API support needs the CRDs at start-up.
  cert-manager:
    enabled: true
    wave: -5
    namespace: cert-manager
    releaseName: cert-manager
    chart: { repoURL: https://charts.jetstack.io, name: cert-manager, version: v1.21.3 }
    valuesDir: gitops/platform/cert-manager
    syncOptions: [ServerSideApply=true]

  # The shared Gateway, its TLS issuer and one HTTPRoute per exposed UI (local chart).
  ingress:
    enabled: true
    wave: -4
    namespace: gateway
    chartPath: gitops/platform/ingress   # receives global.gatewayProvider

  # Identity provider for single sign-on into Grafana and Argo CD.
  # Wave 1: its ServiceMonitor needs the Prometheus Operator CRDs.
  keycloak:
    enabled: true
    wave: 1
    namespace: keycloak
    releaseName: keycloak
    chart: { repoURL: https://codecentric.github.io/helm-charts, name: keycloakx, version: 7.4.0 }
    valuesDir: gitops/platform/keycloak

  # --------------------------------------------------------------- Metrics ---
  kube-prometheus-stack:
    enabled: true
    wave: 0
    releaseName: kps
    chart: { repoURL: https://prometheus-community.github.io/helm-charts, name: kube-prometheus-stack, version: 93.11.1 }
    valuesDir: gitops/platform/kube-prometheus-stack
    syncOptions: [ServerSideApply=true]   # CRDs exceed the client-side annotation limit

  # ------------------------------------------------------------------ Logs ---
  loki:
    enabled: true
    wave: 1
    releaseName: loki
    chart: { repoURL: https://grafana.github.io/helm-charts, name: loki, version: 7.7.0 }
    valuesDir: gitops/platform/loki

  # ---------------------------------------------------------------- Traces ---
  # kind uses the monolithic chart (local disk); cloud envs switch to
  # tempo-distributed + object storage in their values-<env>.yaml.
  tempo:
    enabled: true
    wave: 1
    releaseName: tempo
    chart: { repoURL: https://grafana.github.io/helm-charts, name: tempo, version: 1.24.4 }
    valuesDir: gitops/platform/tempo

  # ------------------------------------------------------- OpenTelemetry -----
  otel-operator:
    enabled: true
    wave: 1
    releaseName: otel-operator
    chart: { repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts, name: opentelemetry-operator, version: 0.129.2 }
    valuesDir: gitops/platform/otel-operator
    syncOptions: [ServerSideApply=true]

  otel-gateway:
    enabled: true
    wave: 2
    releaseName: otel-gateway
    chart: { repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts, name: opentelemetry-collector, version: 0.183.2 }
    valuesDir: gitops/platform/otel-gateway

  otel-agent:
    enabled: true
    wave: 3
    releaseName: otel-agent
    chart: { repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts, name: opentelemetry-collector, version: 0.183.2 }
    valuesDir: gitops/platform/otel-agent

  otel-cluster:
    enabled: true
    wave: 3
    releaseName: otel-cluster
    chart: { repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts, name: opentelemetry-collector, version: 0.183.2 }
    valuesDir: gitops/platform/otel-cluster

  # ------------------------------------------------------------ FinOps ------
  opencost:
    enabled: true
    wave: 2
    releaseName: opencost
    chart: { repoURL: https://opencost.github.io/opencost-helm-chart, name: opencost, version: 2.5.35 }
    valuesDir: gitops/platform/opencost

  # ------------------------------------------- Dashboards, rules, SLOs ------
  observability-config:
    enabled: true
    wave: 4
    path: gitops/observability-config/overlays   # + /<env>
    syncOptions: [SkipDryRunOnMissingResource=true, ServerSideApply=true]

  # ---------------------------------------------- Commercial (optional) -----
  datadog-operator:
    enabled: false
    wave: 1
    namespace: datadog
    releaseName: datadog-operator
    chart: { repoURL: https://helm.datadoghq.com, name: datadog-operator, version: 2.33.0 }
    valuesDir: gitops/platform/datadog-operator
  datadog-agent:
    enabled: false
    wave: 2
    namespace: datadog
    path: gitops/addons/datadog
    pathIsFlat: true
    syncOptions: [SkipDryRunOnMissingResource=true]

  # ------------------------------------------------------ Workloads ---------
  demo-shop:
    enabled: true
    wave: 5
    namespace: demo
    path: gitops/apps/demo-shop/overlays
