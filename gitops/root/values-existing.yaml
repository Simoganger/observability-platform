# Plug the platform into an EXISTING cluster that already runs Argo CD and workloads.
# See docs/onboarding-existing-cluster.md.
global:
  env: existing
components:
  # Your Argo CD keeps managing itself; we only add Applications to it.
  argocd:
    enabled: false
  # Brownfield clusters bring their own ingress, certificates and identity provider.
  # Enable any of these if yours lacks them; SSO against your IdP: docs/sso.md.
  gateway-api:
    enabled: false
  istio-base:
    enabled: false
  istiod:
    enabled: false
  envoy-gateway-crds:
    enabled: false
  envoy-gateway:
    enabled: false
  cert-manager:
    enabled: false
  ingress:
    enabled: false
  keycloak:
    enabled: false
  # Swap to tempo-distributed if you have object storage (recommended).
  tempo:
    chart: { repoURL: https://grafana.github.io/helm-charts, name: tempo-distributed, version: 1.61.3 }
  # Your own workloads replace the demo; onboard them with one annotation.
  demo-shop:
    enabled: false
