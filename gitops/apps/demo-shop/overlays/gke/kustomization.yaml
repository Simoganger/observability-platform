apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
replicas:
  - { name: frontend, count: 2 }
  - { name: orders, count: 2 }
  - { name: payments, count: 2 }
patches:
  - target: { kind: Deployment, name: "frontend|orders|payments" }
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector: { matchLabels: { app.kubernetes.io/part-of: demo-shop } }
