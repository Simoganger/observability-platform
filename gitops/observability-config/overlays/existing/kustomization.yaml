apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # Tempo runs as tempo-distributed here → query through the query-frontend.
  - target: { kind: Service, name: tempo-query }
    patch: |-
      - op: replace
        path: /spec/externalName
        value: tempo-query-frontend.observability.svc.cluster.local
