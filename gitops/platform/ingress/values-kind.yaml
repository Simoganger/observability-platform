# kind: nip.io resolves *.127.0.0.1.nip.io to 127.0.0.1 on your laptop; host
# ports 80/443 map to localService's node ports (terraform/envs/kind), and
# CoreDNS rewrites the same names to that Service inside the cluster.
# Keep in sync with var.domain in terraform/envs/kind.
domain: 127.0.0.1.nip.io

infrastructure:
  replicas: 1
  serviceType: ClusterIP   # no cloud LB on kind; traffic enters via localService

localService:
  enabled: true

issuer:
  type: selfsigned
