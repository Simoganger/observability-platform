{{- $v := .Values -}}
# http://* → https://* (cert-manager's ACME solver routes use an Exact path match
# on /.well-known/acme-challenge/<token>, which takes precedence over this one).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
spec:
  parentRefs:
    - name: {{ $v.gateway.name }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- range $name, $r := $v.routes }}
{{- if $r.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $r.namespace }}
spec:
  parentRefs:
    - name: {{ $v.gateway.name }}
      namespace: {{ $.Release.Namespace }}
      sectionName: {{ $name }}
  hostnames:
    - {{ include "ingress.host" (dict "root" $ "name" $name) | quote }}
  rules:
    - backendRefs:
        - name: {{ $r.service }}
          port: {{ $r.port }}
{{- end }}
{{- end }}
