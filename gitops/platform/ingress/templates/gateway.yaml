{{- $v := .Values -}}
{{- $p := include "ingress.provider" . -}}
# Plain Gateway API — identical for every implementation except className and
# the (standard) infrastructure.parametersRef to the provider's tuning object.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $v.gateway.name }}
  annotations:
    # cert-manager's gateway-shim creates one Certificate per HTTPS listener.
    cert-manager.io/cluster-issuer: {{ $v.issuer.name }}
spec:
  gatewayClassName: {{ include "ingress.className" . }}
  {{- if eq $p "istio" }}
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ $v.gateway.name }}-gateway-options
  {{- else if eq $p "envoy" }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ $v.gateway.name }}
  {{- end }}
  listeners:
    # Plain HTTP only redirects to HTTPS (and serves ACME HTTP-01 challenges).
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ printf "*.%s" $v.domain | quote }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- range $name, $r := $v.routes }}
    {{- if $r.enabled }}
    - name: {{ $name }}
      protocol: HTTPS
      port: 443
      hostname: {{ include "ingress.host" (dict "root" $ "name" $name) | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ $name }}-tls
      # Only the app's own namespace may attach routes for its hostname.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $r.namespace }}
    {{- end }}
    {{- end }}
