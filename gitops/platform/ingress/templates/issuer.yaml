{{- $i := .Values.issuer -}}
{{- if eq $i.type "acme" }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $i.name }}
spec:
  acme:
    server: {{ $i.acme.server }}
    {{- with $i.acme.email }}
    email: {{ . }}
    {{- end }}
    privateKeySecretRef:
      name: {{ $i.name }}-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: {{ .Values.gateway.name }}
                namespace: {{ .Release.Namespace }}
                sectionName: http
{{- else if eq $i.type "selfsigned" }}
# Lab CA: a self-signed root, then a CA issuer that signs every listener.
# Export it to trust it locally: `make lab-ca`.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $i.name }}-root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $i.name }}-ca
  namespace: cert-manager          # ClusterIssuers read CA secrets from here
spec:
  isCA: true
  commonName: Observability Platform Lab CA
  secretName: {{ $i.name }}-ca
  duration: 87600h                 # 10 years: it only exists in a lab cluster
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ $i.name }}-root
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $i.name }}
spec:
  ca:
    secretName: {{ $i.name }}-ca
{{- else }}
{{- fail "issuer.type must be acme or selfsigned" }}
{{- end }}
