# GKE: managed control plane → etcd/scheduler/controller-manager are not scrapeable.
# HA Prometheus pair + 3-node Alertmanager mesh, pd-ssd volumes, spread across AZs.
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }

prometheus:
  prometheusSpec:
    replicas: 2
    retention: 15d
    externalLabels:
      cluster: gke-observability
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: premium-rwo
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 100Gi
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
    # Long-term storage: remote-write to Google Managed Prometheus / Mimir / Thanos Receive.
    # remoteWrite:
    #   - url: https://<your-remote-write-endpoint>
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

alertmanager:
  alertmanagerSpec:
    replicas: 3
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: premium-rwo
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

grafana:
  replicas: 2
  podDisruptionBudget:
    minAvailable: 1
  # For >1 replica use an external database (Cloud SQL PostgreSQL) instead of SQLite:
  # grafana.ini:
  #   database: { type: postgres, host: ..., name: grafana, user: grafana }
  # envFromSecret: grafana-db
  grafana.ini:
    server:
      root_url: https://grafana.example.com
