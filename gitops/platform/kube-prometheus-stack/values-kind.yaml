# kind: control-plane metrics are exposed by the kubeadm patches in
# terraform/envs/kind (bind 0.0.0.0), so etcd/scheduler/controller-manager
# and kube-proxy are fully monitored — same as a real cluster.
prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: 4GB
    externalLabels:
      cluster: kind-observability
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 2Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi

kubeEtcd:
  service:
    port: 2381
    targetPort: 2381

grafana:
  grafana.ini:
    server:
      root_url: https://grafana.127.0.0.1.nip.io
    auth.generic_oauth:
      enabled: true
      auth_url: https://keycloak.127.0.0.1.nip.io/realms/observability/protocol/openid-connect/auth
      token_url: https://keycloak.127.0.0.1.nip.io/realms/observability/protocol/openid-connect/token
      api_url: https://keycloak.127.0.0.1.nip.io/realms/observability/protocol/openid-connect/userinfo
      signout_redirect_url: https://keycloak.127.0.0.1.nip.io/realms/observability/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Fgrafana.127.0.0.1.nip.io%2Flogin
      # kind only: the gateway certificate comes from a self-signed lab CA.
      tls_skip_verify_insecure: true
