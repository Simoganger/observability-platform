# Envoy Gateway — Gateway API controller. The Gateway itself, its EnvoyProxy
# settings and the HTTPRoutes live in gitops/platform/ingress.
deployment:
  envoyGateway:
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }

config:
  envoyGateway:
    logging:
      level:
        default: info
