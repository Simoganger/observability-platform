# Envoy Gateway — Gateway API controller (provider: envoy). The Gateway, its
# EnvoyProxy settings and the HTTPRoutes live in gitops/platform/ingress.
crds:
  enabled: false          # envoy-gateway-crds + gateway-api components own them

deployment:
  envoyGateway:
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }

config:
  envoyGateway:
    provider:
      type: Kubernetes
      kubernetes:
        # Run each Gateway's Envoy pods in the Gateway's namespace (like Istio),
        # so the provider-neutral platform-gateway Service can select them.
        deploy:
          type: GatewayNamespace
    logging:
      level:
        default: info
