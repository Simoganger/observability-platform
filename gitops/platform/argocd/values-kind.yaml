# kind: SSO through the in-cluster Keycloak at https://keycloak.127.0.0.1.nip.io
global:
  domain: argocd.127.0.0.1.nip.io      # → configs.cm.url

configs:
  cm:
    # kind only: the gateway certificate comes from a self-signed lab CA.
    oidc.tls.insecure.skip.verify: "true"
    oidc.config: |
      name: Keycloak
      issuer: https://keycloak.127.0.0.1.nip.io/realms/observability
      clientID: argocd
      clientSecret: $argocd-oidc:client-secret
      requestedScopes: ["openid", "profile", "email"]
      logoutURL: https://keycloak.127.0.0.1.nip.io/realms/observability/protocol/openid-connect/logout?id_token_hint={{token}}&post_logout_redirect_uri={{logoutRedirectURL}}
