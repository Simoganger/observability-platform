# GKE: Distributed mode on GCS with Workload Identity (terraform/envs/gke).
deploymentMode: Distributed
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: loki@<PROJECT_ID>.iam.gserviceaccount.com   # terraform output loki_gsa_email
loki:
  storage:
    type: gcs
    bucketNames:
      chunks: <PREFIX>-loki-chunks       # terraform output loki_bucket
      ruler: <PREFIX>-loki-chunks
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: gcs
        schema: v13
        index: { prefix: loki_index_, period: 24h }
  compactor:
    retention_enabled: true
    delete_request_store: gcs
ingester:
  replicas: 3
  zoneAwareReplication: { enabled: true }
  persistence: { enabled: true, size: 20Gi, storageClass: premium-rwo }
distributor: { replicas: 3, maxUnavailable: 1 }
querier: { replicas: 3, maxUnavailable: 1 }
queryFrontend: { replicas: 2, maxUnavailable: 1 }
queryScheduler: { replicas: 2 }
indexGateway: { replicas: 2, maxUnavailable: 1 }
compactor: { replicas: 1 }
ruler: { enabled: false }
patternIngester: { replicas: 1 }
gateway: { replicas: 2 }
singleBinary: { replicas: 0 }
write: { replicas: 0 }
read: { replicas: 0 }
backend: { replicas: 0 }
chunksCache: { enabled: true, allocatedMemory: 2048 }
resultsCache: { enabled: true, allocatedMemory: 512 }
