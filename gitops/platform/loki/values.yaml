# =============================================================================
# Grafana Loki — log storage. Native OTLP ingestion at http://loki-gateway/otlp
# Common settings; storage + deployment mode are set per environment.
# =============================================================================
loki:
  auth_enabled: false            # single-tenant; enable + X-Scope-OrgID for multi-tenancy
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3          # overridden per env (filesystem on kind)
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true      # trace_id / span_id live here (OTLP)
    volume_enabled: true
    retention_period: 744h               # 31d
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    max_global_streams_per_user: 20000
    otlp_config:
      resource_attributes:
        attributes_config:
          # Index a few high-value, LOW-cardinality resource attributes as labels.
          - action: index_label
            attributes:
              - k8s.cluster.name
              - deployment.environment.name
              - k8s.node.name
  compactor:
    retention_enabled: true
    delete_request_store: s3     # overridden per env
  pattern_ingester:
    enabled: true                # powers "Explore Logs" pattern detection
  ui:
    enabled: true

gateway:
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

monitoring:
  serviceMonitor:
    enabled: true
  dashboards:
    enabled: true
    annotations:
      grafana_folder: Platform / Loki
  rules:
    enabled: true
    alerting: true

lokiCanary:
  enabled: false
test:
  enabled: false
