# Monolithic Tempo on local disk.
tempo:
  reportingEnabled: false
  retention: 72h
  storage:
    trace:
      backend: local
      local: { path: /var/tempo/traces }
      wal: { path: /var/tempo/wal }
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: "0.0.0.0:4317" }
        http: { endpoint: "0.0.0.0:4318" }
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }
persistence:
  enabled: true
  size: 5Gi
serviceMonitor:
  enabled: true
