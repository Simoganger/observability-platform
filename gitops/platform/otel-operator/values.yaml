# =============================================================================
# OpenTelemetry Operator — zero-code auto-instrumentation.
# Any existing Deployment opts in with ONE annotation, e.g.:
#   instrumentation.opentelemetry.io/inject-java:   "observability/default"
#   instrumentation.opentelemetry.io/inject-python: "observability/default"
#   instrumentation.opentelemetry.io/inject-nodejs: "observability/default"
#   instrumentation.opentelemetry.io/inject-dotnet: "observability/default"
#   instrumentation.opentelemetry.io/inject-go:     "observability/default"   (eBPF, privileged)
# The Instrumentation CR lives in gitops/observability-config/base/instrumentation.
# =============================================================================
manager:
  collectorImage:
    repository: otel/opentelemetry-collector-contrib
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }
  serviceMonitor:
    enabled: true
  featureGatesMap: {}

# Self-signed webhook certs generated by Helm — no cert-manager dependency.
admissionWebhooks:
  certManager:
    enabled: false
  autoGenerateCert:
    enabled: true
    recreate: false
