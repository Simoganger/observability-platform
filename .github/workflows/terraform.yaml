name: Terraform

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yaml"]
  push:
    branches: [main]
    paths: ["terraform/**"]

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [kind, eks, gke]
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive terraform
      - working-directory: terraform/envs/${{ matrix.env }}
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - uses: terraform-linters/setup-tflint@v5
      - working-directory: terraform/envs/${{ matrix.env }}
        run: tflint --init && tflint --format compact

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Trivy IaC misconfiguration scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: terraform
          format: sarif
          output: trivy-iac.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"     # report, don't block (lab defaults trade security for cost)
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-iac.sarif
