# Build → test → scan → push to DockerHub → bump the image tag in Git → Argo CD deploys.
# Required repo settings:
#   Variables: DOCKERHUB_USERNAME
#   Secrets:   DOCKERHUB_TOKEN   (DockerHub → Account settings → Personal access tokens, Read & Write)
name: demo-shop CI

on:
  pull_request:
    paths: ["apps/demo-shop/**", ".github/workflows/demo-shop-ci.yaml"]
  push:
    branches: [main]
    paths: ["apps/demo-shop/**", ".github/workflows/demo-shop-ci.yaml"]
  workflow_dispatch:

concurrency:
  group: demo-shop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/demo-shop

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo-shop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/demo-shop/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: apps/demo-shop
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Build single-arch image for scanning
        uses: docker/build-push-action@v6
        with:
          context: apps/demo-shop
          load: true
          tags: demo-shop:scan
          cache-from: type=gha
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: demo-shop:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif

  # GitOps promotion: CI never touches the cluster — it changes Git, Argo CD reconciles.
  promote:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: imranismail/setup-kustomize@v2
      - name: Bump image tag
        working-directory: gitops/apps/demo-shop/base
        run: |
          kustomize edit set image "${IMAGE}:${{ needs.build.outputs.tag }}"
          cat kustomization.yaml
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/demo-shop/base/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "deploy(demo-shop): ${{ needs.build.outputs.tag }} [skip ci]"
          git push
